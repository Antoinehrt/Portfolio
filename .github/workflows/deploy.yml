name: Deploy to Hostinger

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Create Angular environment file
              run: |
                  mkdir -p src/environments
                  cat > src/environments/environment.ts <<EOF
                  export const environment = {
                    production: true,
                    EMAILJS_USER_ID: '${{ secrets.EMAILJS_USER_ID }}',
                    EMAILJS_SERVICE_ID: '${{ secrets.EMAILJS_SERVICE_ID }}',
                    EMAILJS_TEMPLATE_ID: '${{ secrets.EMAILJS_TEMPLATE_ID }}',
                  };
                  EOF

            - name: Build
              run: npm run build -- --configuration production

            - name: Restructure output for Hostinger
              run: |
                  mkdir -p deploy
                  cp -r dist/portfolio/browser/en-GB/. deploy/
                  cp -r dist/portfolio/browser/fr-BE deploy/fr
                  cp -r dist/portfolio/browser/nl-BE deploy/nl

