<article class="project-card">
    <header class="project-header">
        <img class="project-image" src="{{project.imageUrl}}" alt="{{project.name}} preview image" loading="lazy">
        <div class="project-title-section">
            <h2 class="project-title">{{ project.name }}</h2>
            <p class="project-description">{{ project.description }}</p>
        </div>
    </header>

    <section class="project-topics" *ngIf="project.topics && project.topics.length > 0">
        <div class="topics-container">
          <span class="topic-tag" *ngFor="let topic of project.topics">
            #{{ topic }}
          </span>
        </div>
    </section>

    <section class="project-technical-info">
        <h3 class="technical-title">Technical Analysis</h3>

        <div class="technical-details">
            <div class="detail-item">
                <span class="detail-label">Repository:</span>
                <div class="detail-value">
                    <a class="repo-link" [href]="project.repoUrl" target="_blank" rel="noopener noreferrer">
                        View on GitHub
                    </a>
                </div>
            </div>

            <div class="detail-item">
                <span class="detail-label">Created:</span>
                <time class="detail-value" [dateTime]="project.createdAt">
                    {{ project.createdAt | date:'MMM yyyy' }}
                </time>
            </div>

            <div class="detail-item">
                <span class="detail-label">Last Updated:</span>
                <time class="detail-value" [dateTime]="project.updateAt">
                    {{ project.updateAt | date:'MMM yyyy' }}
                </time>
            </div>

            <div class="detail-item">
                <span class="detail-label">Size:</span>
                <span class="detail-value">{{ project.size | formatSize }}</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Status:</span>
                <span class="detail-value">{{ project.status }}</span>
            </div>
        </div>

        <div class="languages-section" *ngIf="project.languages && project.languages.length > 0">
            <h4 class="languages-title">Languages Used</h4>
            <app-language-chart [languages]="project.languages"></app-language-chart>
        </div>
    </section>
</article>
