<div class="timeline-items">
    <ng-template ngFor let-item [ngForOf]="experienceEntries.slice().reverse()">
        <div class="timeline-item"
             (click)="navigateToDetail(item, $event)"
             (keydown)="navigateToDetail(item, $event)"
             tabindex="0"
             role="button"
             [attr.aria-label]="'experiences.' + item.component + '.name' | translate">
            <div class="timeline-dot"></div>
            <div class="timeline-date">
                {{ item.date | yearOnly }}
            </div>
            <div class="timeline-content">
                <h3>{{ 'experiences.' + item.component + '.name' | translate }}</h3>
                <p [innerHTML]="'experiences.' + item.component + '.description' | translate"></p>
            </div>
        </div>
    </ng-template>
</div>
