<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="triHautDroite2">
      <polygon points="0,0 600,0 600,400" />
    </clipPath>
    <clipPath id="triBasGauche2">
      <polygon points="0,0 0,400 600,400" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <g clip-path="url(#triHautDroite2)">
    <rect x="0"   y="0" width="200" height="400" fill="#000000"/>
    <rect x="200" y="0" width="200" height="400" fill="#FDDA24"/>
    <rect x="400" y="0" width="200" height="400" fill="#EF3340"/>
  </g>

  <g clip-path="url(#triBasGauche2)">
    <rect x="0"   y="0" width="200" height="400" fill="#0055A4"/>
    <rect x="200" y="0" width="200" height="400" fill="#FFFFFF"/>
    <rect x="400" y="0" width="200" height="400" fill="#EF4135"/>
  </g>

  <line x1="0" y1="0" x2="600" y2="400" stroke="#1a1a1a" stroke-width="3"/>
</svg>
